name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyless auth: the job exchanges its GitHub OIDC token for the AWS deploy role.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

      # The site builds fine without any AWS setup. Until the infrastructure
      # exists and the secrets are populated, skip the deploy rather than
      # failing it — a red cross here would mean "the build is broken", which
      # is not what an unconfigured deploy target means.
      - name: Check deploy configuration
        id: gate
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DEPLOY_ROLE" ] && [ -n "$BUCKET" ] && [ -n "$DISTRIBUTION" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Deploy target configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "AWS deploy secrets are not set, so there is nothing to deploy to yet."
              echo "Run \`terraform apply\` in \`infra/terraform\`, then set:"
              echo
              echo "- \`AWS_DEPLOY_ROLE_ARN\`"
              echo "- \`AWS_S3_BUCKET\`"
              echo "- \`AWS_CLOUDFRONT_DISTRIBUTION_ID\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amanbind.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # Fingerprinted assets first, with a long max-age. Uploading these before
      # the HTML means a visitor never fetches a page whose assets are missing.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --exclude "*" \
            --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      - name: Sync HTML and everything else
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete \
            --no-progress

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created; waiting for completion."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Summary
        run: echo "Deployed to https://amanbind.com" >> "$GITHUB_STEP_SUMMARY"
