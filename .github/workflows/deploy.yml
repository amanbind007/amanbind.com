name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Keyless auth: the job exchanges its GitHub OIDC token for the AWS deploy role.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://amanbind.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # Fingerprinted assets first, with a long max-age. Uploading these before
      # the HTML means a visitor never fetches a page whose assets are missing.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --exclude "*" \
            --include "_astro/*" \
            --cache-control "public,max-age=31536000,immutable" \
            --no-progress

      - name: Sync HTML and everything else
        run: |
          aws s3 sync dist/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" \
            --delete \
            --no-progress

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created; waiting for completion."
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      - name: Summary
        run: echo "Deployed to https://amanbind.com" >> "$GITHUB_STEP_SUMMARY"
